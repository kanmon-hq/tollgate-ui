<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tollgate Console — Local Development</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-7xl mx-auto px-4 py-8">
    <header class="mb-8 border-b border-slate-800 pb-6 flex items-center justify-between">
      <div>
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center font-bold text-slate-950 text-xl shadow-lg shadow-emerald-500/20">
            TG
          </div>
          <div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Tollgate Management Console</h1>
            <p class="text-sm text-slate-400">API Gateway & Key Broker Local Development Environment</p>
          </div>
        </div>
      </div>
      <div class="flex items-center space-x-3 text-xs">
        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          Backend: http://localhost:8080
        </span>
      </div>
    </header>

    <main>
      <!-- Tollgate Custom Element UI (未指定の属性は .env / 環境変数から自動補完されます) -->
      <tollgate-console
        title="Tollgate API Key Gateway 管理コンソール"
      ></tollgate-console>
    </main>
  </div>

  <script type="module" src="/src/index.ts"></script>
</body>
</html>
